name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './data/*' -print0 | xargs -0 -n1 php -l
      - name: Regression tests
        run: |
          php tests/run.php
          php tests/hosting.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTTP flow and concurrent writes
        run: |
          node tests/http.cjs
          node tests/concurrency.cjs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build hosted PHP image
        run: docker build -t skillswap-hosted .
      - name: Run Apache deployment checks
        run: |
          docker run -d --name skillswap -p 127.0.0.1:18080:8080 -e PORT=8080 -e SKILLSWAP_PUBLIC_DEMO=1 -e SKILLSWAP_TRUST_PROXY=1 skillswap-hosted
          node tests/container.cjs
      - name: Container logs
        if: failure()
        run: docker logs skillswap
