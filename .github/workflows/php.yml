name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './data/*' -print0 | xargs -0 -n1 php -l
      - name: Regression tests
        run: php tests/run.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTTP flow and concurrent writes
        run: |
          node tests/http.cjs
          node tests/concurrency.cjs
